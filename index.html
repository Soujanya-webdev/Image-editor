
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LensLab — Basic Image Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- header  -->
     <div class="header">
      <div class="header-left">
        <span class="logo">LensLab</span>
        <span class="subtitle">Image Editor</span>
      </div>
      <div class="header-actions">
        <button type="button" class="btn btn-ghost" id="btn-open" aria-label="Open image">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Open
        </button>
        <button type="button" class="btn btn-ghost" id="btn-undo" aria-label="Undo" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6.7 3L3 13"/></svg>
          Undo
        </button>
        <button type="button" class="btn btn-ghost" id="btn-redo" aria-label="Redo" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6.7 3L21 13"/></svg>
          Redo
        </button>
        <button type="button" class="btn btn-ghost" id="btn-reset" aria-label="Reset all edits" disabled>
          Reset
        </button>
        <button type="button" class="btn btn-primary" id="btn-download" aria-label="Download image" disabled>
          Download
        </button>
      </div>
    </header>

    <div class="main">
      <aside class="sidebar" id="sidebar">
        <section class="panel-sections">
          <h2 class="panel-title">Adjust</h2>
          <div class="control-group">
            <div class="control-row">
              <label for="brightness">Brightness</label>
              <span class="value-display" id="brightness-value">0</span>
            </div>
            <input type="range" id="brightness" min="-100" max="100" value="0" disabled>
          </div>
        <div class="control-group">
          <div class="control-row">
             <label for="contrast">Contrast</label>
              <span class="value-display" id="contrast-val">0</span>
            </div>
            <input type="range" id="contrast" min="-100" max="100" value="0" disabled>
          </div>
          <div class="control-group">
            <div class="control-row">
              <label for="saturation">Saturation</label>
              <span class="value-display" id="saturation-val">0</span>
            </div>
            <input type="range" id="saturation" min="-100" max="100" value="0" disabled>
          </div>
          <div class="control-group">
            <div class="control-row">
              <label for="exposure">Exposure</label>
              <span class="value-display" id="exposure-val">0</span>
            </div>
            <input type="range" id="exposure" min="-100" max="100" value="0" disabled>
          </div>
          <div class="control-group">
            <div class="control-row">
              <label for="blur">Blur</label>
              <span class="value-display" id="blur-val">0</span>
            </div>
            <input type="range" id="blur" min="0" max="20" value="0" step="0.5" disabled>
          </div>
        </section>

          <section class="panel-section">
            <h2 class="panel-title">Filters</h2>
            <div class="filter-buttons">
                <button type="button" class="filter-btn" data-filter="none" disabled>None</button>
            <button type="button" class="filter-btn" data-filter="grayscale" disabled>Grayscale</button>
            <button type="button" class="filter-btn" data-filter="sepia" disabled>Sepia</button>
            <button type="button" class="filter-btn" data-filter="invert" disabled>Invert</button>
            </div>
          </section>

    <section class="panel-section">
          <h2 class="panel-title">Transform</h2>
          <div class="transform-row">
            <button type="button" class="btn btn-tool" id="btn-rotate-left" aria-label="Rotate left" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2.5 2v6h6"/><path d="M2.66 15.57a10 10 0 1 0 .57-8.38"/></svg>
            </button>
            <button type="button" class="btn btn-tool" id="btn-rotate-right" aria-label="Rotate right" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6"/><path d="M21.34 15.57a10 10 0 1 1-.57-8.38"/></svg>
            </button>
            <button type="button" class="btn btn-tool" id="btn-flip-h" aria-label="Flip horizontal" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v14c0 1.1.9 2 2 2h3"/><path d="M16 3h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-3"/><path d="M12 20v2"/><path d="M12 14v2"/><path d="M12 8v2"/><path d="M12 2v2"/></svg>
            </button>
            <button type="button" class="btn btn-tool" id="btn-flip-v" aria-label="Flip vertical" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v3"/><path d="M3 16v3a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3"/><path d="M10 12H8"/><path d="M16 12h-2"/><path d="M22 12h-2"/><path d="M4 12H2"/></svg>
            </button>
          </div>
          <button type="button" class="btn btn-secondary full-width" id="btn-reset-transform" disabled>Reset Transform</button>
        </section>

       <section class="panel-section">
        <h2 class="panel-title">Crop</h2>
        <div class="crop-controls">
          <button class="btn btn-secondary full-width" id="btn-crop-apply" disabled style="display: none">Apply Crop</button>
       <button type="button" class="btn btn-ghost full-width" id="btn-crop-cancel" disabled style="display:none">Cancel</button>
          </div>
        </section>
         

        

        </div>
        </section>
      </aside>
    </div>
      </div>
     </div>
  </div>
</body>
</html>
